{% load lp_extras %}<span class="stars-display">{% for s in rating|star_range %}{% if s == 'full' %}<i class="fa-solid fa-star"></i>{% elif s == 'half' %}<i class="fa-solid fa-star-half-stroke"></i>{% else %}<i class="fa-regular fa-star"></i>{% endif %}{% endfor %}</span>{% if show_count %}<span class="text-muted-2 small ms-1">{{ rating }} &middot; {{ count }} review{{ count|pluralize }}</span>{% endif %}
